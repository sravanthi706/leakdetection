<svg viewBox="0 0 1260 560" xmlns="http://www.w3.org/2000/svg" style="color:#111826;background:#ffffff;font-family:'IBM Plex Sans',Arial,sans-serif;" role="img" aria-label="Detail diagram of the AI detection layer: monitored text feeds a propagation graph builder into a Graph Neural Network producing a cascade anomaly score, a sentence embedding encoder into a cosine similarity check producing a content match score, and a feature extractor into an autoencoder producing a reconstruction error score; monitored images feed a perceptual hash extraction into a Hamming distance check producing an image match score; all four scores combine in a weighted ensemble fusion into an anomaly score that triggers an alert with feature attribution; a synthetic data generator offline-trains the Graph Neural Network and the Autoencoder, the two components that are literal trained neural networks.">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-family="IBM Plex Sans, sans-serif" fill="currentColor">

    <!-- legend -->
    <g transform="translate(994,4)" font-size="11">
      <rect x="0" y="0" width="16" height="10" rx="2" fill="none" stroke="#2E5AAC" stroke-width="1.6"/>
      <text x="22" y="9">pipeline / classical step</text>
      <rect x="0" y="18" width="16" height="10" rx="2" fill="none" stroke="#A8620F" stroke-width="2.4"/>
      <text x="22" y="27">trained neural network</text>
    </g>

    <!-- inputs -->
    <g stroke="#2E5AAC" stroke-width="1.6" fill="none">
      <rect x="24" y="126" width="190" height="68" rx="4"/>
      <rect x="24" y="330" width="190" height="68" rx="4"/>
    </g>
    <g font-size="12.5" font-weight="600" text-anchor="middle">
      <text x="119" y="154">Monitored channels</text>
      <text x="119" y="171" font-size="10.5" font-weight="400">text &mdash; public Telegram groups</text>
      <text x="119" y="358">Monitored channels</text>
      <text x="119" y="375" font-size="10.5" font-weight="400">images &mdash; shared photos/screenshots</text>
    </g>

    <!-- C2 encode -->
    <g stroke-width="1.6" fill="none">
      <rect x="244" y="24" width="210" height="68" rx="4" stroke="#2E5AAC"/>
      <rect x="244" y="126" width="210" height="68" rx="4" stroke="#A8620F" stroke-width="2.4"/>
      <rect x="244" y="228" width="210" height="68" rx="4" stroke="#2E5AAC"/>
      <rect x="244" y="330" width="210" height="68" rx="4" stroke="#2E5AAC"/>
    </g>
    <g font-size="12.5" font-weight="600" text-anchor="middle">
      <text x="349" y="52">Propagation graph builder</text>
      <text x="349" y="69" font-size="10.5" font-weight="400">nodes = accounts, edges = shares</text>
      <text x="349" y="154">Sentence embedding encoder</text>
      <text x="349" y="171" font-size="10.5" font-weight="400">pretrained transformer (frozen)</text>
      <text x="349" y="256">Feature vector extraction</text>
      <text x="349" y="273" font-size="10.5" font-weight="400">keyword density, burst, hour-of-day</text>
      <text x="349" y="358">Perceptual hash extraction</text>
      <text x="349" y="375" font-size="10.5" font-weight="400">pHash &mdash; DCT-based</text>
    </g>

    <!-- C3 model -->
    <g stroke-width="1.6" fill="none">
      <rect x="484" y="24" width="250" height="68" rx="4" stroke="#A8620F" stroke-width="2.6"/>
      <rect x="484" y="126" width="250" height="68" rx="4" stroke="#2E5AAC"/>
      <rect x="484" y="228" width="250" height="68" rx="4" stroke="#A8620F" stroke-width="2.6"/>
      <rect x="484" y="330" width="250" height="68" rx="4" stroke="#2E5AAC"/>
    </g>
    <g font-size="12.5" font-weight="700" text-anchor="middle">
      <text x="609" y="52">Graph Neural Network</text>
      <text x="609" y="69" font-size="10.5" font-weight="400">2&ndash;3 GraphSAGE/GCN layers &rarr; cascade embedding</text>
      <text x="609" y="154" font-weight="600">Cosine similarity</text>
      <text x="609" y="171" font-size="10.5" font-weight="400">vs. committed paper embedding</text>
      <text x="609" y="256">Autoencoder</text>
      <text x="609" y="273" font-size="10.5" font-weight="400">dense encoder&ndash;decoder, ~8-d bottleneck</text>
      <text x="609" y="358" font-weight="600">Hamming distance</text>
      <text x="609" y="375" font-size="10.5" font-weight="400">vs. committed image hash</text>
    </g>

    <!-- C4 score -->
    <g stroke="#2E5AAC" stroke-width="1.6" fill="none">
      <rect x="764" y="24" width="190" height="68" rx="4"/>
      <rect x="764" y="126" width="190" height="68" rx="4"/>
      <rect x="764" y="228" width="190" height="68" rx="4"/>
      <rect x="764" y="330" width="190" height="68" rx="4"/>
    </g>
    <g font-size="12.5" font-weight="600" text-anchor="middle">
      <text x="859" y="62">Cascade anomaly score</text>
      <text x="859" y="164">Content match score</text>
      <text x="859" y="266">Reconstruction error score</text>
      <text x="859" y="368">Image match score</text>
    </g>

    <!-- C5 fusion / output -->
    <g stroke="#2E5AAC" stroke-width="1.8" fill="none">
      <rect x="994" y="140" width="220" height="100" rx="5"/>
    </g>
    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="1104" y="184">WEIGHTED ENSEMBLE</text>
      <text x="1104" y="200">FUSION</text>
      <text x="1104" y="220" font-size="10.5" font-weight="400">combines all four signal scores</text>
    </g>
    <g stroke="#2E5AAC" stroke-width="1.6" fill="none">
      <rect x="994" y="260" width="220" height="54" rx="4"/>
    </g>
    <text x="1104" y="292" font-size="13" font-weight="700" text-anchor="middle">Anomaly score (0&ndash;1)</text>
    <g stroke="#A8620F" stroke-width="2.2" fill="#A8620F" fill-opacity="0.08">
      <rect x="994" y="334" width="220" height="64" rx="4"/>
    </g>
    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="1104" y="360">ALERT</text>
      <text x="1104" y="378" font-size="10.5" font-weight="400">+ feature attribution (which signal fired)</text>
    </g>

    <!-- training loop -->
    <g stroke="#8A5049" stroke-width="1.4" stroke-dasharray="4,3" fill="none">
      <rect x="244" y="460" width="510" height="68" rx="4"/>
    </g>
    <g font-size="12.5" font-weight="600" text-anchor="middle" fill="#8A5049">
      <text x="499" y="488">SYNTHETIC DATA GENERATOR</text>
      <text x="499" y="505" font-size="10.5" font-weight="400">labeled normal / leak-pattern sessions &mdash; offline training</text>
    </g>

    <!-- arrows: inputs to encode -->
    <g stroke="currentColor" stroke-width="1.3" opacity="0.6" fill="none">
      <line x1="214" y1="150" x2="244" y2="58" marker-end="url(#arrow2)"/>
      <line x1="214" y1="160" x2="244" y2="160" marker-end="url(#arrow2)"/>
      <line x1="214" y1="170" x2="244" y2="262" marker-end="url(#arrow2)"/>
      <line x1="214" y1="364" x2="244" y2="364" marker-end="url(#arrow2)"/>
      <!-- encode to model -->
      <line x1="454" y1="58" x2="484" y2="58" marker-end="url(#arrow2)"/>
      <line x1="454" y1="160" x2="484" y2="160" marker-end="url(#arrow2)"/>
      <line x1="454" y1="262" x2="484" y2="262" marker-end="url(#arrow2)"/>
      <line x1="454" y1="364" x2="484" y2="364" marker-end="url(#arrow2)"/>
      <!-- model to score -->
      <line x1="734" y1="58" x2="764" y2="58" marker-end="url(#arrow2)"/>
      <line x1="734" y1="160" x2="764" y2="160" marker-end="url(#arrow2)"/>
      <line x1="734" y1="262" x2="764" y2="262" marker-end="url(#arrow2)"/>
      <line x1="734" y1="364" x2="764" y2="364" marker-end="url(#arrow2)"/>
      <!-- score to fusion (fan-in) -->
      <line x1="954" y1="58" x2="994" y2="180" marker-end="url(#arrow2)"/>
      <line x1="954" y1="160" x2="994" y2="185" marker-end="url(#arrow2)"/>
      <line x1="954" y1="262" x2="994" y2="195" marker-end="url(#arrow2)"/>
      <line x1="954" y1="364" x2="994" y2="200" marker-end="url(#arrow2)"/>
      <!-- fusion to score to alert -->
      <line x1="1104" y1="240" x2="1104" y2="258" marker-end="url(#arrow2)"/>
      <line x1="1104" y1="314" x2="1104" y2="332" marker-end="url(#arrow2)"/>
    </g>

    <!-- training trunk + branches, routed through the C3/C4 gutter to avoid crossing boxes -->
    <g stroke="#8A5049" stroke-width="1.3" stroke-dasharray="4,3" fill="none" opacity="0.85">
      <line x1="749" y1="460" x2="749" y2="58"/>
      <line x1="749" y1="58" x2="734" y2="58" marker-end="url(#arrow2)"/>
      <line x1="749" y1="262" x2="734" y2="262" marker-end="url(#arrow2)"/>
    </g>
    <text x="754" y="420" font-size="10.5" font-style="italic" fill="#8A5049">trains</text>

  </g>
</svg>