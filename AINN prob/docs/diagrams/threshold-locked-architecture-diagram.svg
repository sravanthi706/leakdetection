<svg viewBox="0 0 1260 1000" xmlns="http://www.w3.org/2000/svg" style="color:#111826;background:#ffffff;font-family:'IBM Plex Sans',Arial,sans-serif;" role="img" aria-label="Architecture diagram: an air-gapped authoring system encrypts the paper with AES-256-GCM and commits its hash to a ledger; the content key is wrapped with post-quantum ML-KEM and split via threshold secret sharing across four independent stakeholder nodes, each gated by TPM plus TEE hardware attestation and a Verifiable Delay Function time proof, replacing a single trusted time-lock server; shares reconstruct only inside a TEE enclave at the exam center to produce the plaintext paper during the exam window; a parallel, independent detection layer feeds monitored channels through a graph neural network cascade model and perceptual hash image matching into an anomaly alert.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-family="IBM Plex Sans, sans-serif" fill="currentColor">

    <!-- legend -->
    <g transform="translate(958,20)" font-size="11">
      <rect x="0" y="0" width="16" height="10" rx="2" fill="none" stroke="#2E5AAC" stroke-width="1.6"/>
      <text x="22" y="9">base architecture</text>
      <rect x="0" y="18" width="16" height="10" rx="2" fill="none" stroke="#A8620F" stroke-width="1.6"/>
      <text x="22" y="27">upgraded component</text>
      <text x="0" y="45" fill="#8A5049" font-style="italic">&#10005; legacy, removed</text>
    </g>

    <!-- ROW A: authoring / commitment -->
    <g stroke="#2E5AAC" stroke-width="1.6" fill="none">
      <rect x="24" y="24" width="200" height="72" rx="4"/>
      <rect x="254" y="24" width="210" height="72" rx="4"/>
    </g>
    <g stroke="#A8620F" stroke-width="2" fill="none">
      <rect x="494" y="24" width="210" height="72" rx="4"/>
    </g>
    <g stroke="#2E5AAC" stroke-width="1.6" fill="none">
      <rect x="254" y="126" width="450" height="56" rx="4"/>
    </g>

    <g font-size="13" font-weight="600" text-anchor="middle">
      <text x="124" y="55">Air-gapped</text>
      <text x="124" y="71">authoring system</text>
      <text x="359" y="55">AES-256-GCM</text>
      <text x="359" y="71">encrypt paper</text>
      <text x="599" y="55">ML-KEM key wrap</text>
      <text x="599" y="71" font-size="11" font-weight="400">(FIPS 203, post-quantum)</text>
    </g>
    <text x="479" y="158" text-anchor="middle" font-size="12.5" font-weight="600">Commitment ledger</text>
    <text x="479" y="174" text-anchor="middle" font-size="11" font-weight="400">hash(paper) published &amp; timestamped, pre-exam</text>

    <g stroke="currentColor" stroke-width="1.4" opacity="0.75">
      <line x1="224" y1="60" x2="248" y2="60" marker-end="url(#arrow)"/>
      <line x1="464" y1="60" x2="488" y2="60" marker-end="url(#arrow)"/>
      <line x1="359" y1="96" x2="359" y2="120" marker-end="url(#arrow)"/>
    </g>
    <line x1="704" y1="60" x2="730" y2="60" stroke="#8A5049" stroke-width="1.3" stroke-dasharray="3,3"/>
    <text x="736" y="50" font-size="11" font-style="italic" fill="#8A5049">&#10005; legacy:</text>
    <text x="736" y="64" font-size="11" font-style="italic" fill="#8A5049">RSA-4096 / ECC key wrap</text>

    <!-- ROW B title -->
    <text x="24" y="203" font-size="13.5" font-weight="700" fill="#2E5AAC">THRESHOLD CUSTODY &mdash; t-of-n across independent stakeholders</text>
    <line x1="620" y1="197" x2="646" y2="197" stroke="#8A5049" stroke-width="1.3" stroke-dasharray="3,3"/>
    <text x="652" y="201" font-size="11" font-style="italic" fill="#8A5049">&#10005; legacy: single Time-Lock Key Server (one trusted operator)</text>

    <!-- fan-out from ledger -->
    <g stroke="currentColor" stroke-width="1.3" opacity="0.6">
      <line x1="359" y1="182" x2="166" y2="232" marker-end="url(#arrow)"/>
      <line x1="359" y1="182" x2="470" y2="232" marker-end="url(#arrow)"/>
      <line x1="479" y1="182" x2="774" y2="232" marker-end="url(#arrow)"/>
      <line x1="479" y1="182" x2="1078" y2="232" marker-end="url(#arrow)"/>
    </g>
    <text x="466" y="222" font-size="11" font-style="italic" opacity="0.75">split into n shares (t required to reconstruct)</text>

    <!-- 4 stakeholder nodes -->
    <g>
      <!-- template repeated at 4 x-offsets: 24, 328, 632, 936 -->
      <g stroke="#2E5AAC" stroke-width="1.6" fill="none"><rect x="24" y="234" width="284" height="232" rx="5"/></g>
      <g stroke="#2E5AAC" stroke-width="1.6" fill="none"><rect x="328" y="234" width="284" height="232" rx="5"/></g>
      <g stroke="#2E5AAC" stroke-width="1.6" fill="none"><rect x="632" y="234" width="284" height="232" rx="5"/></g>
      <g stroke="#2E5AAC" stroke-width="1.6" fill="none"><rect x="936" y="234" width="284" height="232" rx="5"/></g>

      <g font-size="13" font-weight="600" text-anchor="middle">
        <text x="166" y="256">NTA HQ &mdash; Share&#8321;</text>
        <text x="470" y="256">State Authority &mdash; Share&#8322;</text>
        <text x="774" y="256">Independent Audit &mdash; Share&#8323;</text>
        <text x="1078" y="256">Custodian &mdash; Share&#8324;</text>
      </g>

      <!-- sub-boxes per node: TPM (blue), TEE (amber), VDF (amber) -->
      <g stroke-width="1.4" fill="none" font-size="11" text-anchor="middle">
        <!-- node 1 -->
        <rect x="38" y="274" width="256" height="38" rx="3" stroke="#2E5AAC"/>
        <text x="166" y="297" fill="currentColor" stroke="none">TPM &mdash; device identity, boot integrity</text>
        <rect x="38" y="324" width="256" height="38" rx="3" stroke="#A8620F"/>
        <text x="166" y="347" fill="currentColor" stroke="none">TEE (TDX/SEV-SNP/CCA) &mdash; runtime enclave</text>
        <rect x="38" y="374" width="256" height="38" rx="3" stroke="#A8620F"/>
        <text x="166" y="397" fill="currentColor" stroke="none">VDF proof: elapsed &#8805; window_start</text>
        <text x="166" y="446" fill="#A8620F" font-style="italic">k fails &rarr; share self-erased</text>

        <!-- node 2 -->
        <rect x="342" y="274" width="256" height="38" rx="3" stroke="#2E5AAC"/>
        <text x="470" y="297" fill="currentColor" stroke="none">TPM &mdash; device identity, boot integrity</text>
        <rect x="342" y="324" width="256" height="38" rx="3" stroke="#A8620F"/>
        <text x="470" y="347" fill="currentColor" stroke="none">TEE (TDX/SEV-SNP/CCA) &mdash; runtime enclave</text>
        <rect x="342" y="374" width="256" height="38" rx="3" stroke="#A8620F"/>
        <text x="470" y="397" fill="currentColor" stroke="none">VDF proof: elapsed &#8805; window_start</text>
        <text x="470" y="446" fill="#A8620F" font-style="italic">k fails &rarr; share self-erased</text>

        <!-- node 3 -->
        <rect x="646" y="274" width="256" height="38" rx="3" stroke="#2E5AAC"/>
        <text x="774" y="297" fill="currentColor" stroke="none">TPM &mdash; device identity, boot integrity</text>
        <rect x="646" y="324" width="256" height="38" rx="3" stroke="#A8620F"/>
        <text x="774" y="347" fill="currentColor" stroke="none">TEE (TDX/SEV-SNP/CCA) &mdash; runtime enclave</text>
        <rect x="646" y="374" width="256" height="38" rx="3" stroke="#A8620F"/>
        <text x="774" y="397" fill="currentColor" stroke="none">VDF proof: elapsed &#8805; window_start</text>
        <text x="774" y="446" fill="#A8620F" font-style="italic">k fails &rarr; share self-erased</text>

        <!-- node 4 -->
        <rect x="950" y="274" width="256" height="38" rx="3" stroke="#2E5AAC"/>
        <text x="1078" y="297" fill="currentColor" stroke="none">TPM &mdash; device identity, boot integrity</text>
        <rect x="950" y="324" width="256" height="38" rx="3" stroke="#A8620F"/>
        <text x="1078" y="347" fill="currentColor" stroke="none">TEE (TDX/SEV-SNP/CCA) &mdash; runtime enclave</text>
        <rect x="950" y="374" width="256" height="38" rx="3" stroke="#A8620F"/>
        <text x="1078" y="397" fill="currentColor" stroke="none">VDF proof: elapsed &#8805; window_start</text>
        <text x="1078" y="446" fill="#A8620F" font-style="italic">k fails &rarr; share self-erased</text>
      </g>
    </g>

    <!-- convergence to reconstruction -->
    <g stroke="currentColor" stroke-width="1.3" opacity="0.6">
      <line x1="166" y1="466" x2="620" y2="558" marker-end="url(#arrow)"/>
      <line x1="470" y1="466" x2="620" y2="558" marker-end="url(#arrow)"/>
      <line x1="774" y1="466" x2="640" y2="558" marker-end="url(#arrow)"/>
      <line x1="1078" y1="466" x2="640" y2="558" marker-end="url(#arrow)"/>
    </g>
    <text x="636" y="546" font-size="11" font-style="italic" opacity="0.75" text-anchor="middle">t shares combine</text>

    <g stroke="#2E5AAC" stroke-width="1.8" fill="none">
      <rect x="430" y="560" width="400" height="76" rx="5"/>
    </g>
    <g font-size="13.5" font-weight="700" text-anchor="middle">
      <text x="630" y="592">t-of-n RECONSTRUCTION</text>
      <text x="630" y="610" font-size="11.5" font-weight="400">inside TEE enclave &mdash; K never leaves encrypted memory</text>
    </g>

    <line x1="630" y1="636" x2="630" y2="672" stroke="currentColor" stroke-width="1.4" marker-end="url(#arrow)" opacity="0.8"/>

    <g stroke="#A8620F" stroke-width="2" fill="#A8620F" fill-opacity="0.08">
      <rect x="480" y="676" width="300" height="64" rx="5"/>
    </g>
    <g font-size="13.5" font-weight="700" text-anchor="middle">
      <text x="630" y="704">PLAINTEXT PAPER</text>
      <text x="630" y="722" font-size="11.5" font-weight="400">exists only from this point, only for the exam window</text>
    </g>

    <!-- ROW E: detection layer -->
    <text x="24" y="795" font-size="13.5" font-weight="700" fill="#2E5AAC">LEAK DETECTION &mdash; parallel, independent of the custody chain above</text>
    <line x1="700" y1="789" x2="726" y2="789" stroke="#8A5049" stroke-width="1.3" stroke-dasharray="3,3"/>
    <text x="732" y="793" font-size="11" font-style="italic" fill="#8A5049">&#10005; legacy: keyword / LSTM-only text monitoring</text>

    <g stroke="#2E5AAC" stroke-width="1.6" fill="none">
      <rect x="24" y="850" width="240" height="80" rx="4"/>
    </g>
    <g font-size="12.5" font-weight="600" text-anchor="middle">
      <text x="144" y="884">Monitored channels</text>
      <text x="144" y="901" font-size="11" font-weight="400">public Telegram groups, image sources</text>
    </g>

    <g stroke="#A8620F" stroke-width="2" fill="none">
      <rect x="310" y="800" width="280" height="70" rx="4"/>
      <rect x="310" y="900" width="280" height="70" rx="4"/>
    </g>
    <g font-size="12.5" font-weight="600" text-anchor="middle">
      <text x="450" y="828">GNN cascade model</text>
      <text x="450" y="846" font-size="11" font-weight="400">who-shared-with-whom propagation</text>
      <text x="450" y="928">Perceptual hash (pHash)</text>
      <text x="450" y="946" font-size="11" font-weight="400">image match vs. committed hash</text>
    </g>

    <g stroke="#2E5AAC" stroke-width="1.8" fill="none">
      <rect x="940" y="830" width="250" height="110" rx="5"/>
    </g>
    <g font-size="13.5" font-weight="700" text-anchor="middle">
      <text x="1065" y="878">ANOMALY SCORE</text>
      <text x="1065" y="896" font-size="11.5" font-weight="400">&rarr; alert to monitoring team</text>
    </g>

    <g stroke="currentColor" stroke-width="1.3" opacity="0.6">
      <line x1="264" y1="878" x2="306" y2="835" marker-end="url(#arrow)"/>
      <line x1="264" y1="900" x2="306" y2="935" marker-end="url(#arrow)"/>
      <line x1="590" y1="835" x2="936" y2="862" marker-end="url(#arrow)"/>
      <line x1="590" y1="935" x2="936" y2="905" marker-end="url(#arrow)"/>
    </g>

  </g>
</svg>